<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThalosPrime v1.0 — Operational System</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #30363d;
      --accent:    #58a6ff;
      --accent2:   #3fb950;
      --warn:      #d29922;
      --danger:    #f85149;
      --text:      #c9d1d9;
      --text-dim:  #8b949e;
      --radius:    8px;
      --font:      'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header .logo {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .5px;
    }
    header .version {
      background: var(--border);
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 11px;
      color: var(--text-dim);
    }
    header .status-badge {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--accent2);
    }
    header .status-badge::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent2);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }
    #sys-clock {
      margin-left: 16px;
      font-size: 12px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    /* ── Layout ── */
    .main-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 280px 1fr 300px;
      grid-template-rows: 1fr;
      height: calc(100vh - 53px);
    }

    /* ── Panels ── */
    .panel {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel:last-child { border-right: none; }
    .panel-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    /* ── Session Panel ── */
    .session-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-size: 13px;
      cursor: pointer;
      font-family: var(--font);
      transition: opacity .15s;
      width: 100%;
    }
    .btn:hover { opacity: .85; }
    .btn:active { opacity: .7; }
    .btn-primary  { background: var(--accent);  color: #0d1117; border-color: var(--accent); }
    .btn-success  { background: var(--accent2); color: #0d1117; border-color: var(--accent2); }
    .btn-warn     { background: var(--warn);    color: #0d1117; border-color: var(--warn); }
    .btn-danger   { background: var(--danger);  color: #fff;    border-color: var(--danger); }
    .btn-ghost    { background: transparent;    color: var(--text); border-color: var(--border); }
    .btn-sm { padding: 4px 10px; font-size: 12px; width: auto; }

    .session-list { display: flex; flex-direction: column; gap: 8px; }
    .session-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      cursor: default;
      transition: border-color .15s;
    }
    .session-card:hover { border-color: var(--accent); }
    .session-card.selected { border-color: var(--accent); background: #1c2636; }
    .session-card .sc-id {
      font-size: 11px;
      color: var(--text-dim);
      font-family: monospace;
      margin-bottom: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-card .sc-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .state-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .state-initialized { background: #1c2b3a; color: var(--accent); border: 1px solid var(--accent); }
    .state-running     { background: #1b2e1e; color: var(--accent2); border: 1px solid var(--accent2); }
    .state-paused      { background: #2e2516; color: var(--warn); border: 1px solid var(--warn); }
    .state-terminated  { background: #2e1b1b; color: var(--danger); border: 1px solid var(--danger); }
    .state-error       { background: #2e1b1b; color: var(--danger); border: 1px solid var(--danger); }

    .sc-actions {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    /* ── Chat Panel ── */
    #chat-output {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 88%;
    }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.system { align-self: flex-start; align-items: flex-start; }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user .msg-bubble  { background: var(--accent); color: #0d1117; border-bottom-right-radius: 3px; }
    .system .msg-bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
    .msg-meta { font-size: 10px; color: var(--text-dim); }

    .chat-input-row {
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      background: var(--surface);
    }
    #chat-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 12px;
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      outline: none;
      resize: none;
      height: 40px;
      overflow: hidden;
    }
    #chat-input:focus { border-color: var(--accent); }
    #chat-send {
      width: 40px; height: 40px;
      border-radius: var(--radius);
      background: var(--accent);
      border: none;
      color: #0d1117;
      cursor: pointer;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    #chat-send:hover { opacity: .85; }

    /* ── Log Panel ── */
    .log-entry {
      font-size: 11px;
      line-height: 1.6;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 2px;
      font-family: monospace;
      border-left: 3px solid transparent;
    }
    .log-entry.op    { border-left-color: var(--accent); color: var(--text); }
    .log-entry.ok    { border-left-color: var(--accent2); color: var(--accent2); }
    .log-entry.warn  { border-left-color: var(--warn); color: var(--warn); }
    .log-entry.error { border-left-color: var(--danger); color: var(--danger); }
    .log-ts { color: var(--text-dim); }

    /* ── Stats row ── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      text-align: center;
    }
    .stat-card .stat-val { font-size: 22px; font-weight: 700; color: var(--accent); }
    .stat-card .stat-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
      .panel { border-right: none; border-bottom: 1px solid var(--border); max-height: 280px; }
      .panel:nth-child(2) { max-height: none; }
    }
  </style>
</head>
<body>

<header>
  <span class="logo">&#9670; ThalosPrime</span>
  <span class="version">v1.0</span>
  <span class="status-badge">System Online</span>
  <span id="sys-clock"></span>
</header>

<div class="main-grid">

  <!-- ── LEFT: Session Manager ── -->
  <div class="panel" id="panel-sessions">
    <div class="panel-header">
      <span>Session Manager</span>
      <span id="session-count-badge" style="color:var(--accent)">0</span>
    </div>
    <div class="panel-body">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-val" id="stat-running">0</div>
          <div class="stat-label">Running</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="stat-total">0</div>
          <div class="stat-label">Total</div>
        </div>
      </div>

      <div class="session-controls">
        <button class="btn btn-primary" onclick="App.createSession()">&#43; New Session</button>
        <button class="btn btn-ghost" onclick="App.cleanupTerminated()">&#128465; Cleanup Terminated</button>
      </div>

      <div class="session-list" id="session-list">
        <div style="color:var(--text-dim);font-size:12px;text-align:center;padding:20px 0">
          No sessions yet.<br>Click <strong>+ New Session</strong> to begin.
        </div>
      </div>
    </div>
  </div>

  <!-- ── CENTER: SBI Chat Interface ── -->
  <div class="panel" style="border-right:1px solid var(--border)">
    <div class="panel-header">
      <span>SBI Interface — Synthetic Biological Intelligence</span>
    </div>
    <div id="chat-output"></div>
    <div class="chat-input-row">
      <textarea id="chat-input" placeholder="Type a command or question… (Enter to send)" rows="1"></textarea>
      <button id="chat-send" onclick="App.sendMessage()" title="Send">&#10148;</button>
    </div>
  </div>

  <!-- ── RIGHT: Operation Log ── -->
  <div class="panel">
    <div class="panel-header">
      <span>Operation Log</span>
      <button class="btn btn-ghost btn-sm" onclick="App.clearLog()">Clear</button>
    </div>
    <div class="panel-body" id="op-log"></div>
  </div>

</div>

<script>
/* ─────────────────────────────────────────────────────────────
   ThalosPrime v1.0 — Standalone Operational System
   All logic is self-contained. No external dependencies.
   UTC model: new Date().toISOString() — single standard throughout.
───────────────────────────────────────────────────────────── */

/* ── Enums ── */
const SessionState = Object.freeze({
  INITIALIZED: 'initialized',
  RUNNING:     'running',
  PAUSED:      'paused',
  TERMINATED:  'terminated',
  ERROR:       'error',
});

/* ── Utilities ── */
function utcNow() {
  return new Date().toISOString();
}

function shortId(id) {
  return id.split('-')[0];
}

function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString(undefined, { hour12: false });
}

function uuid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) {
    return crypto.randomUUID();
  }
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

/* ── AgentSession ── */
class AgentSession {
  constructor({ sessionId, state, createdAt, updatedAt, metadata, errorMessage, stateHistory, transitionCount } = {}) {
    this.sessionId       = sessionId      || uuid();
    this.state           = state          || SessionState.INITIALIZED;
    this.createdAt       = createdAt      || utcNow();
    this.updatedAt       = updatedAt      || utcNow();
    this.metadata        = metadata       || {};
    this.errorMessage    = errorMessage   || null;
    this.stateHistory    = stateHistory   || [];
    this.transitionCount = transitionCount || 0;
  }

  _transitionTo(newState, errorMessage = null) {
    return new AgentSession({
      sessionId:       this.sessionId,
      state:           newState,
      createdAt:       this.createdAt,
      updatedAt:       utcNow(),
      metadata:        { ...this.metadata },
      errorMessage:    errorMessage !== null ? errorMessage : this.errorMessage,
      stateHistory:    [...this.stateHistory, {
        from:      this.state,
        to:        newState,
        timestamp: utcNow(),
      }],
      transitionCount: this.transitionCount + 1,
    });
  }

  start() {
    if (this.state !== SessionState.INITIALIZED) {
      throw new Error(`Cannot start session from state ${this.state}. Must be INITIALIZED.`);
    }
    return this._transitionTo(SessionState.RUNNING);
  }

  pause() {
    if (this.state !== SessionState.RUNNING) {
      throw new Error(`Cannot pause session from state ${this.state}. Must be RUNNING.`);
    }
    return this._transitionTo(SessionState.PAUSED);
  }

  resume() {
    if (this.state !== SessionState.PAUSED) {
      throw new Error(`Cannot resume session from state ${this.state}. Must be PAUSED.`);
    }
    return this._transitionTo(SessionState.RUNNING);
  }

  terminate() {
    if (this.state === SessionState.TERMINATED) {
      throw new Error('Session is already terminated.');
    }
    return this._transitionTo(SessionState.TERMINATED);
  }

  markError(msg) {
    return this._transitionTo(SessionState.ERROR, msg);
  }

  toDict() {
    return {
      session_id:       this.sessionId,
      state:            this.state,
      created_at:       this.createdAt,
      updated_at:       this.updatedAt,
      metadata:         this.metadata,
      error_message:    this.errorMessage,
      state_history:    this.stateHistory,
      transition_count: this.transitionCount,
    };
  }

  static fromDict(d) {
    return new AgentSession({
      sessionId:       d.session_id,
      state:           d.state,
      createdAt:       d.created_at,
      updatedAt:       d.updated_at,
      metadata:        d.metadata || {},
      errorMessage:    d.error_message || null,
      stateHistory:    d.state_history || [],
      transitionCount: d.transition_count || 0,
    });
  }
}

/* ── SessionManager ── */
class SessionManager {
  constructor() {
    this._sessions    = {};
    this._opLog       = [];
  }

  createSession(metadata = {}) {
    const s = new AgentSession({ metadata });
    this._sessions[s.sessionId] = s;
    this._log('create', s.sessionId);
    return s;
  }

  getSession(id)   { return this._sessions[id] || null; }
  listSessions(state = null) {
    const all = Object.values(this._sessions);
    return state ? all.filter(s => s.state === state) : all;
  }

  startSession(id) {
    return this._apply(id, 'start', s => s.start());
  }
  pauseSession(id) {
    return this._apply(id, 'pause', s => s.pause());
  }
  resumeSession(id) {
    return this._apply(id, 'resume', s => s.resume());
  }
  terminateSession(id) {
    return this._apply(id, 'terminate', s => s.terminate());
  }

  cleanupTerminated() {
    const ids = Object.keys(this._sessions).filter(id => this._sessions[id].state === SessionState.TERMINATED);
    ids.forEach(id => delete this._sessions[id]);
    this._log('cleanup', `${ids.length} sessions`);
    return ids.length;
  }

  getOpLog() { return [...this._opLog]; }

  _apply(id, opName, fn) {
    const s = this._sessions[id];
    if (!s) throw new Error(`Session ${id} not found`);
    const updated = fn(s);
    this._sessions[id] = updated;
    this._log(opName, id);
    return updated;
  }

  _log(op, target) {
    this._opLog.push({ op, target, timestamp: utcNow() });
  }
}

/* ── SBI Intent Engine ── */
const IntentType = Object.freeze({
  SESSION_CREATE:       'session_create',
  SESSION_CONTROL:      'session_control',
  SESSION_QUERY:        'session_query',
  SYSTEM_STATUS:        'system_status',
  HELP_REQUEST:         'help_request',
  GREETING:             'greeting',
  GENERAL_CONVERSATION: 'general_conversation',
  UNKNOWN:              'unknown',
});

const INTENT_PATTERNS = [
  {
    intent: IntentType.GREETING,
    patterns: [/\b(hi|hello|hey|greetings)\b/i, /^(hi|hello|hey)[\s!.]*$/i],
  },
  {
    intent: IntentType.HELP_REQUEST,
    patterns: [/\b(help|assist|support|tutorial)\b/i, /\b(how do i|how to|what can you)\b/i],
  },
  {
    intent: IntentType.SESSION_CREATE,
    patterns: [/\b(create|start|begin|new|launch)\b.*\b(session|agent|task)\b/i, /\b(session|agent|task)\b.*\b(create|new|start)\b/i],
  },
  {
    intent: IntentType.SESSION_CONTROL,
    patterns: [/\b(pause|stop|resume|terminate|end|kill)\b.*\b(session|agent)\b/i, /\b(session|agent)\b.*\b(pause|stop|resume|terminate|end)\b/i],
  },
  {
    intent: IntentType.SESSION_QUERY,
    patterns: [/\b(status|state|info)\b.*\b(session|agent)\b/i, /\b(show|list|display|get)\b.*\b(sessions?|agents?)\b/i, /\b(how many|count)\b.*\bsession/i],
  },
  {
    intent: IntentType.SYSTEM_STATUS,
    patterns: [/\b(system|health|status|performance)\b/i, /\bhow\b.*\b(running|doing|working|performing)\b/i],
  },
  {
    intent: IntentType.GENERAL_CONVERSATION,
    patterns: [/\b(thank|thanks|appreciate|awesome|cool|nice|great)\b/i, /\b(ok|okay|alright|got it|understood)\b/i],
  },
];

function classifyIntent(text) {
  for (const { intent, patterns } of INTENT_PATTERNS) {
    for (const p of patterns) {
      if (p.test(text)) return intent;
    }
  }
  return IntentType.UNKNOWN;
}

/* ── App Controller ── */
const App = (() => {
  const manager = new SessionManager();
  let selectedSessionId = null;

  /* ── Clock ── */
  function startClock() {
    const el = document.getElementById('sys-clock');
    function tick() {
      el.textContent = new Date().toUTCString().replace('GMT', 'UTC');
    }
    tick();
    setInterval(tick, 1000);
  }

  /* ── Logging ── */
  function log(message, type = 'op') {
    const el = document.getElementById('op-log');
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    const ts = new Date().toISOString().substring(11, 23);
    entry.innerHTML = `<span class="log-ts">[${ts}]</span> ${escHtml(message)}`;
    el.appendChild(entry);
    el.scrollTop = el.scrollHeight;
  }

  function clearLog() {
    document.getElementById('op-log').innerHTML = '';
  }

  /* ── Session UI ── */
  function renderSessions() {
    const container = document.getElementById('session-list');
    const sessions   = manager.listSessions();
    document.getElementById('session-count-badge').textContent = sessions.length;
    document.getElementById('stat-total').textContent = sessions.length;
    document.getElementById('stat-running').textContent =
      manager.listSessions(SessionState.RUNNING).length;

    if (sessions.length === 0) {
      container.innerHTML = `
        <div style="color:var(--text-dim);font-size:12px;text-align:center;padding:20px 0">
          No sessions yet.<br>Click <strong>+ New Session</strong> to begin.
        </div>`;
      return;
    }

    container.innerHTML = '';
    sessions.forEach(s => {
      const card = document.createElement('div');
      card.className = `session-card${s.sessionId === selectedSessionId ? ' selected' : ''}`;
      card.dataset.id = s.sessionId;
      card.onclick = () => selectSession(s.sessionId);

      const canStart     = s.state === SessionState.INITIALIZED;
      const canPause     = s.state === SessionState.RUNNING;
      const canResume    = s.state === SessionState.PAUSED;
      const canTerminate = s.state !== SessionState.TERMINATED && s.state !== SessionState.ERROR;

      card.innerHTML = `
        <div class="sc-id">${escHtml(s.sessionId)}</div>
        <div class="sc-row">
          <span class="state-badge state-${s.state}">${escHtml(s.state)}</span>
          <span style="font-size:10px;color:var(--text-dim)">${fmtTime(s.createdAt)}</span>
        </div>
        ${s.errorMessage ? `<div style="font-size:11px;color:var(--danger);margin-top:4px">${escHtml(s.errorMessage)}</div>` : ''}
        <div class="sc-actions">
          ${canStart     ? `<button class="btn btn-success btn-sm" onclick="event.stopPropagation();App.sessionAction('${s.sessionId}','start')">Start</button>` : ''}
          ${canPause     ? `<button class="btn btn-warn btn-sm"    onclick="event.stopPropagation();App.sessionAction('${s.sessionId}','pause')">Pause</button>` : ''}
          ${canResume    ? `<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();App.sessionAction('${s.sessionId}','resume')">Resume</button>` : ''}
          ${canTerminate ? `<button class="btn btn-danger btn-sm"  onclick="event.stopPropagation();App.sessionAction('${s.sessionId}','terminate')">Terminate</button>` : ''}
        </div>`;

      container.appendChild(card);
    });
  }

  function selectSession(id) {
    selectedSessionId = id;
    renderSessions();
    const s = manager.getSession(id);
    if (s) {
      addMessage('system',
        `Session selected: ${shortId(id)}\n` +
        `  State:       ${s.state}\n` +
        `  Transitions: ${s.transitionCount}\n` +
        `  Created:     ${fmtTime(s.createdAt)}`
      );
    }
  }

  function createSession() {
    const s = manager.createSession({ created_via: 'ui' });
    log(`Session created: ${shortId(s.sessionId)}`, 'ok');
    renderSessions();
    addMessage('system', `New session initialized.\nID: ${s.sessionId}`);
  }

  const ACTION_PAST = { start: 'started', pause: 'paused', resume: 'resumed', terminate: 'terminated' };

  function sessionAction(id, action) {
    try {
      let updated;
      if      (action === 'start')     updated = manager.startSession(id);
      else if (action === 'pause')     updated = manager.pauseSession(id);
      else if (action === 'resume')    updated = manager.resumeSession(id);
      else if (action === 'terminate') updated = manager.terminateSession(id);
      else throw new Error(`Unknown action: ${action}`);

      const pastTense = ACTION_PAST[action] || action;
      log(`Session ${shortId(id)} → ${updated.state}`, 'ok');
      renderSessions();
      addMessage('system', `Session ${shortId(id)} ${pastTense}. New state: ${updated.state}`);
    } catch (err) {
      log(`Error: ${err.message}`, 'error');
      addMessage('system', `Error: ${err.message}`);
    }
  }

  function cleanupTerminated() {
    const n = manager.cleanupTerminated();
    log(`Cleanup: removed ${n} terminated session(s)`, n > 0 ? 'ok' : 'op');
    renderSessions();
    addMessage('system', `Cleanup complete. Removed ${n} terminated session(s).`);
  }

  /* ── SBI Chat ── */
  function addMessage(role, text) {
    const output = document.getElementById('chat-output');
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    wrap.innerHTML = `
      <div class="msg-bubble">${escHtml(text)}</div>
      <div class="msg-meta">${new Date().toLocaleTimeString(undefined, { hour12: false })}</div>`;
    output.appendChild(wrap);
    output.scrollTop = output.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';

    addMessage('user', text);
    const response = processSBI(text);
    addMessage('system', response);
  }

  function processSBI(text) {
    const intent = classifyIntent(text);
    log(`SBI intent: ${intent}`, 'op');

    switch (intent) {
      case IntentType.GREETING:
        return 'Hello. ThalosPrime v1.0 operational system is online.\nType "help" for available commands.';

      case IntentType.HELP_REQUEST:
        return [
          'Available commands:',
          '  • "create session" — Create and start a new agent session',
          '  • "list sessions"  — Show all active sessions',
          '  • "system status"  — Show system health',
          '  • "pause session <id>"     — Pause a running session',
          '  • "resume session <id>"    — Resume a paused session',
          '  • "terminate session <id>" — Terminate a session',
          '  • "cleanup"                — Remove terminated sessions',
          '',
          'Or use the Session Manager panel on the left.',
        ].join('\n');

      case IntentType.SESSION_CREATE: {
        const s = manager.createSession({ created_via: 'sbi' });
        const started = manager.startSession(s.sessionId);
        log(`SBI created session: ${shortId(started.sessionId)}`, 'ok');
        renderSessions();
        return `Session created and started.\nID: ${started.sessionId}\nState: ${started.state}`;
      }

      case IntentType.SESSION_QUERY: {
        const sessions = manager.listSessions();
        if (sessions.length === 0) return 'No active sessions.';
        const lines = sessions.map(s =>
          `  ${shortId(s.sessionId)}  [${s.state}]  transitions: ${s.transitionCount}`
        );
        return `Sessions (${sessions.length}):\n${lines.join('\n')}`;
      }

      case IntentType.SESSION_CONTROL: {
        const lc = text.toLowerCase();
        let action = null;
        if (/\bpause\b/.test(lc))     action = 'pause';
        if (/\bresume\b/.test(lc))    action = 'resume';
        if (/\b(terminate|stop|end|kill)\b/.test(lc)) action = 'terminate';

        // Attempt to find a session id in the text
        const idMatch = text.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i)
                     || text.match(/\b([0-9a-f]{8})\b/i);
        const sessions = manager.listSessions();

        let targetSession = null;
        if (idMatch) {
          targetSession = sessions.find(s =>
            s.sessionId === idMatch[0] || s.sessionId.startsWith(idMatch[0].toLowerCase())
          );
        }
        if (!targetSession && sessions.length === 1) {
          targetSession = sessions[0];
        }
        if (!targetSession && selectedSessionId) {
          targetSession = manager.getSession(selectedSessionId);
        }

        if (!action) return 'Specify an action: pause, resume, or terminate.';
        if (!targetSession) return 'Could not identify the session. Provide a session ID or select one in the panel.';

        try {
          sessionAction(targetSession.sessionId, action);
          const pastTense = ACTION_PAST[action] || action;
          return `Session ${shortId(targetSession.sessionId)} ${pastTense} successfully.`;
        } catch (err) {
          return `Error: ${err.message}`;
        }
      }

      case IntentType.SYSTEM_STATUS: {
        const all      = manager.listSessions();
        const running  = manager.listSessions(SessionState.RUNNING).length;
        const paused   = manager.listSessions(SessionState.PAUSED).length;
        const term     = manager.listSessions(SessionState.TERMINATED).length;
        const opLog    = manager.getOpLog();
        return [
          `ThalosPrime v1.0 — System Status`,
          `  UTC timestamp:   ${utcNow()}`,
          `  Total sessions:  ${all.length}`,
          `  Running:         ${running}`,
          `  Paused:          ${paused}`,
          `  Terminated:      ${term}`,
          `  Operations logged: ${opLog.length}`,
          `  Status:          OPERATIONAL`,
        ].join('\n');
      }

      case IntentType.GENERAL_CONVERSATION:
        return 'Acknowledged. ThalosPrime is ready.';

      default:
        return `Input received. Type "help" to see available commands.\n(Unrecognized intent for: "${text}")`;
    }
  }

  /* ── Security: HTML escape ── */
  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* ── Init ── */
  function init() {
    startClock();

    // Enter key sends message
    document.getElementById('chat-input').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    renderSessions();
    log('ThalosPrime v1.0 operational system initialized', 'ok');
    log(`UTC model: Date.toISOString() — single standard`, 'op');

    addMessage('system',
      'ThalosPrime v1.0 — Operational System Online\n' +
      'UTC model: Date.toISOString() — single deterministic standard\n\n' +
      'Type "help" for available commands, or use the Session Manager on the left.'
    );
  }

  return {
    init,
    createSession,
    sessionAction,
    cleanupTerminated,
    sendMessage,
    clearLog,
  };
})();

document.addEventListener('DOMContentLoaded', App.init);
</script>
</body>
</html>
