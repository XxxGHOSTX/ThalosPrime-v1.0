name: Thalos Prime - Deterministic Tests

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Deterministic Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run linters
      run: |
        # Check code formatting
        black --check src/ tests/
        
        # Check code style
        flake8 src/ tests/ --max-line-length=88 --extend-ignore=E203
    
    - name: Run type checking
      run: |
        mypy src/thalos_prime/
    
    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --tb=short --cov=thalos_prime --cov-report=xml --cov-report=term
    
    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --tb=short
    
    - name: Verify deterministic behavior
      run: |
        # Run tests multiple times to ensure determinism
        echo "Running tests 3 times to verify deterministic behavior..."
        pytest tests/ --tb=short -q
        pytest tests/ --tb=short -q
        pytest tests/ --tb=short -q
        echo "✅ All test runs produced consistent results"
    
    - name: Upload coverage
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-thalos-prime
    
    - name: Test CLI commands
      run: |
        # Install in editable mode if not already
        pip install -e .
        
        # Test CLI is available
        thalos --version
        
        # Test session commands help
        thalos session --help
        thalos session start --help
        thalos session stop --help
        thalos session status --help

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: python-package
        path: dist/
        retention-days: 7
